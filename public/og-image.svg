<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFBEB"/>
      <stop offset="50%" style="stop-color:#FEF3C7"/>
      <stop offset="100%" style="stop-color:#FDE68A"/>
    </linearGradient>
    <linearGradient id="beerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FCD34D"/>
      <stop offset="100%" style="stop-color:#F59E0B"/>
    </linearGradient>
    <linearGradient id="foamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#FEF3C7"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#D97706"/>
      <stop offset="50%" style="stop-color:#F59E0B"/>
      <stop offset="100%" style="stop-color:#D97706"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="150" fill="rgba(251, 191, 36, 0.2)"/>
  <circle cx="1100" cy="530" r="200" fill="rgba(251, 191, 36, 0.15)"/>

  <!-- Beer mug icon -->
  <g transform="translate(120, 180)">
    <rect x="0" y="40" width="120" height="160" rx="12" fill="url(#beerGrad)" stroke="#D97706" stroke-width="4"/>
    <path d="M120 65 Q160 65 160 115 Q160 165 120 165" fill="none" stroke="#D97706" stroke-width="12" stroke-linecap="round"/>
    <ellipse cx="60" cy="40" rx="65" ry="20" fill="url(#foamGrad)" stroke="#FDE68A" stroke-width="2"/>
    <circle cx="25" cy="25" r="15" fill="white"/>
    <circle cx="60" cy="18" r="18" fill="white"/>
    <circle cx="95" cy="25" r="12" fill="white"/>
    <circle cx="35" cy="120" r="6" fill="rgba(255,255,255,0.5)"/>
    <circle cx="75" cy="150" r="5" fill="rgba(255,255,255,0.4)"/>
    <circle cx="50" cy="170" r="5" fill="rgba(255,255,255,0.4)"/>
  </g>

  <!-- Title -->
  <text x="320" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="bold" fill="#1F2937">ビール・お酒</text>
  <text x="320" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="bold" fill="#1F2937">イベント情報</text>

  <!-- Subtitle -->
  <text x="320" y="450" font-family="system-ui, -apple-system, sans-serif" font-size="32" fill="#6B7280">全国のビールイベント情報をひとつの場所で</text>

  <!-- Features -->
  <g transform="translate(320, 500)">
    <rect x="0" y="0" width="160" height="50" rx="25" fill="#F59E0B"/>
    <text x="80" y="33" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="white" text-anchor="middle" font-weight="600">毎日更新</text>

    <rect x="180" y="0" width="200" height="50" rx="25" fill="#10B981"/>
    <text x="280" y="33" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="white" text-anchor="middle" font-weight="600">LINE通知対応</text>

    <rect x="400" y="0" width="180" height="50" rx="25" fill="#6366F1"/>
    <text x="490" y="33" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="white" text-anchor="middle" font-weight="600">複数サイト対応</text>
  </g>
</svg>
