<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="beerGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FCD34D"/>
      <stop offset="100%" style="stop-color:#F59E0B"/>
    </linearGradient>
    <linearGradient id="foamGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#FEF3C7"/>
    </linearGradient>
  </defs>
  <!-- Glass -->
  <rect x="20" y="25" width="50" height="60" rx="5" fill="url(#beerGradient)" stroke="#D97706" stroke-width="2"/>
  <!-- Handle -->
  <path d="M70 35 Q85 35 85 50 Q85 65 70 65" fill="none" stroke="#D97706" stroke-width="6" stroke-linecap="round"/>
  <!-- Foam -->
  <ellipse cx="45" cy="25" rx="27" ry="8" fill="url(#foamGradient)" stroke="#FDE68A" stroke-width="1"/>
  <circle cx="30" cy="20" r="6" fill="white"/>
  <circle cx="45" cy="18" r="7" fill="white"/>
  <circle cx="58" cy="20" r="5" fill="white"/>
  <!-- Bubbles -->
  <circle cx="35" cy="55" r="3" fill="rgba(255,255,255,0.5)"/>
  <circle cx="50" cy="65" r="2" fill="rgba(255,255,255,0.4)"/>
  <circle cx="40" cy="72" r="2.5" fill="rgba(255,255,255,0.4)"/>
</svg>
