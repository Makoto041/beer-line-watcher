<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FEF3C7"/>
      <stop offset="100%" style="stop-color:#FDE68A"/>
    </linearGradient>
    <linearGradient id="beerGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FCD34D"/>
      <stop offset="100%" style="stop-color:#F59E0B"/>
    </linearGradient>
    <linearGradient id="foamGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#FEF3C7"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="180" height="180" rx="40" fill="url(#bgGradient)"/>
  <!-- Glass -->
  <rect x="45" y="50" width="70" height="85" rx="8" fill="url(#beerGradient)" stroke="#D97706" stroke-width="3"/>
  <!-- Handle -->
  <path d="M115 62 Q138 62 138 85 Q138 108 115 108" fill="none" stroke="#D97706" stroke-width="8" stroke-linecap="round"/>
  <!-- Foam -->
  <ellipse cx="80" cy="50" rx="38" ry="12" fill="url(#foamGradient)" stroke="#FDE68A" stroke-width="1"/>
  <circle cx="55" cy="42" r="9" fill="white"/>
  <circle cx="80" cy="38" r="11" fill="white"/>
  <circle cx="102" cy="42" r="8" fill="white"/>
  <!-- Bubbles -->
  <circle cx="60" cy="90" r="4" fill="rgba(255,255,255,0.5)"/>
  <circle cx="85" cy="105" r="3" fill="rgba(255,255,255,0.4)"/>
  <circle cx="70" cy="115" r="3.5" fill="rgba(255,255,255,0.4)"/>
</svg>
